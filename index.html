<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!--
    user-scalable=no + maximum-scale=1: impede o zoom por duplo toque, que
    some com a tela e confunde quem nao domina gestos de toque.
    viewport-fit=cover: usa a tela inteira, inclusive ao lado do entalhe.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#256045">
  <meta name="color-scheme" content="only light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Paciência Spider</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="orientacao-aviso" aria-hidden="true">
    <svg class="orientacao-ilustracao" viewBox="0 0 160 160" fill="none">
      <g class="celular-girando">
        <rect x="52" y="30" width="56" height="100" rx="10" fill="#14181a" stroke="#ffd23f" stroke-width="4"/>
        <rect x="58" y="42" width="44" height="76" rx="4" fill="#256045"/>
        <circle cx="80" cy="36" r="2" fill="#ffd23f"/>
        <line x1="72" y1="124" x2="88" y2="124" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>
      </g>
      <path d="M125 58 C138 74 138 96 122 112" stroke="#ffd23f" stroke-width="4" stroke-linecap="round" fill="none"/>
      <polygon points="117,114 128,116 124,105" fill="#ffd23f"/>
    </svg>
    <p class="orientacao-texto">Gire o celular de lado para jogar</p>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
